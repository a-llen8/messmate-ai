name: Caterer Ops Agent - Monthly Run

on:
  schedule:
    # 03:00 UTC on the 1st = 08:30 AM IST on the 1st of each month. The
    # complaint clusterer uses a 14-day rolling window that barely changes
    # day to day, and this is the only tool needing the heavy embedding /
    # UMAP / HDBSCAN stack, so it gets its own slow, infrequent workflow.
    - cron: '0 3 1 * *'
  workflow_dispatch: {}  # allows manual trigger from the Actions tab, for testing

jobs:
  run-ops-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QR_SECRET: ${{ secrets.QR_SECRET }}
      QR_SEMESTER: ${{ secrets.QR_SEMESTER }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      RUN_MODE: monthly

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-ml.txt

      - name: Run Ops Agent and persist result
        run: |
          python -c "
          from app.agents.ops_agent import execute_and_save
          run = execute_and_save()
          print(f'Run {run.id} completed with status: {run.status}')
          if run.status == 'error':
              raise SystemExit(1)
          "
